version: v2
plugins:
  - local: [go, -C, server, tool, protoc-gen-go]
    out: server/gen
    opt: paths=source_relative
  - local: [go, -C, server, tool, protoc-gen-connect-go]
    out: server/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    out: web/src/gen
    opt: target=js+dts
